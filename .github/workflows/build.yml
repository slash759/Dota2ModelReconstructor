name: build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Dota2ModelReconstructor.slnx
      - run: dotnet build Dota2ModelReconstructor.slnx --configuration Release --no-restore
      - run: dotnet publish src/Dota2ModelReconstructor.Cli/Dota2ModelReconstructor.Cli.csproj --configuration Release --output artifacts/Dota2ModelReconstructor
      - run: dotnet publish src/Dota2ModelReconstructor.Ui/Dota2ModelReconstructor.Ui.csproj --configuration Release --output artifacts/Dota2ModelReconstructor-UI
      - uses: actions/upload-artifact@v4
        with:
          name: Dota2ModelReconstructor-UI-windows
          path: artifacts/Dota2ModelReconstructor-UI
      - uses: actions/upload-artifact@v4
        with:
          name: Dota2ModelReconstructor-windows
          path: artifacts/Dota2ModelReconstructor
